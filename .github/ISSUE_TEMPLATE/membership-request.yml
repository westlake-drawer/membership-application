name: Organization Membership Request
description: GitHub username only; other details go through a private channel.
title: "[Membership] <your GitHub username>"
labels: ["membership-request", "pending-review"]
body:
  - type: markdown
    attributes:
      value: |
        ## GitHub username only

        This issue is public. Do **not** include your name, school email, student ID,
        phone number, or other personal data. A maintainer will reply here with a
        private channel for identity verification.

        Privacy: https://westlake-drawer.github.io/legal/privacy

  - type: input
    id: github
    attributes:
      label: GitHub username
      description: Used for the organization invitation
      placeholder: your-github-username
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: Optional note (no personal data)
      description: For example, which subject area interests you. Do not include anything that identifies you.
      placeholder: e.g. I would like to help maintain mathematics notes
    validations:
      required: false
